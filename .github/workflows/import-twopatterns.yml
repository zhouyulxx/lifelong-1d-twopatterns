name: Import authentic UCR TwoPatterns dataset
on:
  push:
    paths:
      - '.github/workflows/import-twopatterns.yml'
      - 'scripts/fetch_twopatterns.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate original UCR data
        run: python scripts/fetch_twopatterns.py
      - name: Commit original datasets and source hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/TwoPatterns/TwoPatterns_TRAIN.ts data/TwoPatterns/TwoPatterns_TEST.ts data/TwoPatterns/SOURCE.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged"
          else
            git commit -m "data: import verified original UCR TwoPatterns train/test"
            git push origin HEAD:main
          fi
