name: Verify and import UCI integer EEG sequences
on:
  push:
    paths:
      - ".github/workflows/verify-uci-integer.yml"
      - "scripts/import_uci_eeg_integer.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch official UCI source and check all 178 signal entries for integral values
        run: python scripts/import_uci_eeg_integer.py
      - name: Persist lossless integer dataset and validation metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+zhouyulxx@users.noreply.github.com"
          git add -f data/eeg_integer/data.csv.gz data/eeg_integer/SOURCE.json
          if git diff --cached --quiet; then echo "Already up to date"; else
            git commit -m "data: import validated native integer-valued UCI EEG sequences"
            git push origin HEAD:main
          fi
