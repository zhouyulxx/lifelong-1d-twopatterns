name: Real class-incremental EEG - single-class and discriminative controls

on:
  push:
    paths:
      - ".github/workflows/true-class-incremental.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install "numpy>=1.26,<3" "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Single-class-per-stage seed 42
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/generative_single_class_seed42
          python -u run_single_class_incremental.py --seed 42 --classes 5 --window 30 --alpha 1.0 2>&1 | tee results/generative_single_class_seed42/train.log
      - name: Single-class-per-stage seed 43
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/generative_single_class_seed43
          python -u run_single_class_incremental.py --seed 43 --classes 5 --window 30 --alpha 1.0 --output results/generative_single_class_seed43 2>&1 | tee results/generative_single_class_seed43/train.log
      - name: Upload generative results
        uses: actions/upload-artifact@v4
        with:
          name: integer-eeg-generative-per-class
          path: results/generative_single_class_seed*/
          retention-days: 30

  discriminative:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Train A then B (global 4 class head, no task ID)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/discriminative_global_sequential_seed42
          python -u run_global_class_incremental.py --mode sequential --seed 42 --epochs 20 2>&1 | tee results/discriminative_global_sequential_seed42/train.log
      - name: Train B-only (same table architecture)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/discriminative_global_B_only_seed42
          python -u run_global_class_incremental.py --mode B_only --seed 42 --epochs 20 2>&1 | tee results/discriminative_global_B_only_seed42/train.log
      - name: Joint A and B oracle upper-bound
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/discriminative_global_joint_seed42
          python -u run_global_class_incremental.py --mode joint --seed 42 --epochs 20 2>&1 | tee results/discriminative_global_joint_seed42/train.log
      - name: Upload global-output discriminative results
        uses: actions/upload-artifact@v4
        with:
          name: integer-eeg-global-class-incremental
          path: results/discriminative_global_*/
          retention-days: 30
