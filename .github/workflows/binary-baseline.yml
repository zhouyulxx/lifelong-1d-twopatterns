name: Train binary A-B-A TwoPatterns baseline
on:
  push:
    paths:
      - ".github/workflows/binary-baseline.yml"
      - "run_binary_baseline.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch and NumPy
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Validate repo and data
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from continual_1d.data import load_twopatterns
          x,y,xt,yt,labels=load_twopatterns()
          print(x.shape,xt.shape,labels)
          assert x.shape==(1000,128) and xt.shape==(4000,128)
          PY
      - name: Train A, then train B, then re-test A
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/binary_seed42
          python run_binary_baseline.py --device cpu --epochs-a 20 --epochs-b 20 --seed 42 2>&1 | tee results/binary_seed42/train.log
      - name: Upload results and checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: twopatterns-binary-A-B-A-seed42
          path: results/binary_seed42/
          retention-days: 30
      - name: Save measured results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/binary_seed42/metrics.json results/binary_seed42/accuracy_matrix.csv results/binary_seed42/train_history.csv results/binary_seed42/train.log
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "results: measure binary A-B-A same-output baseline"
            git push origin HEAD:main
          fi
