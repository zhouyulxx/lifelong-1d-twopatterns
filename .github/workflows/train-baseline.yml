name: Train and report TwoPatterns A to B baseline

on:
  push:
    paths:
      - ".github/workflows/train-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch and NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu

      - name: Validate datasets and baseline code
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from continual_1d.data import load_twopatterns
          xtr,ytr,xte,yte,labels=load_twopatterns("data")
          print("Loaded:",xtr.shape,xte.shape,sorted(set(ytr)),sorted(set(yte)),labels)
          PY

      - name: Train A and B and save all results
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/baseline_seed42
          python run_baseline.py --device cpu --epochs-a 20 --epochs-b 20 --seed 42 --output-dir results/baseline_seed42 2>&1 | tee results/baseline_seed42/train.log

      - name: Upload results as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: twopatterns-baseline-seed42
          path: results/baseline_seed42/
          retention-days: 30

      - name: Commit reproducible results into repository
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/baseline_seed42/metrics.json results/baseline_seed42/accuracy_matrix.csv results/baseline_seed42/train_history.csv results/baseline_seed42/confusion_after_B.csv results/baseline_seed42/train.log
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "results: measured TwoPatterns A-to-B baseline (seed 42)"
            git push origin HEAD:main
          fi
