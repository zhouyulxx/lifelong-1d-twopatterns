name: PenDigits rotation-axis dummy column 45-degree fix
on:
  push:
    paths:
      - ".github/workflows/pendigits-45degree-dummy-column.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy and check syntax
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m py_compile run_pendigits_45degree_lattice.py
      - name: Run four class 0,45,90,135 degree rotation with unused first column
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/pendigits_45degree_dummy_axis
          python -u run_pendigits_45degree_lattice.py --mode dummy_axis 2>&1 | tee results/pendigits_45degree_dummy_axis/train.log
      - name: Compare against existing isolated 45-degree control
        run: |
          python - <<'PY'
          import json
          a=json.load(open("results/pendigits_45degree_dummy_axis/metrics.json"))
          b=json.load(open("results/pendigits_45degree_isolated/metrics.json"))
          assert a["rotation_angles_degrees"]==[0,45,90,135]
          assert a["unused_geometric_axis_column"]==0
          assert a["geometric_columns_per_class"]==17
          assert a["unique_active_spatial_cells"]==6464
          assert a["shared_cells_across_classes"]==0
          assert b["shared_cells_across_classes"]==0
          assert len(a["all_stages"])==len(b["all_stages"])==4
          for x,y in zip(a["all_stages"],b["all_stages"]):
              assert x["all_seen_class_accuracy"]==y["all_seen_class_accuracy"]
              assert x["confusion"]==y["confusion"]
              assert x["per_class_accuracy"]==y["per_class_accuracy"]
          print("PASS: Unused rotation-axis column. All predictions identical to independent tables.")
          for stage in a["all_stages"]:
              print("learned",stage["seen_classes"],"acc",stage["all_seen_class_accuracy"])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pendigits-45degree-dummy-axis-experiment
          path: results/pendigits_45degree_dummy_axis/
          retention-days: 30
      - name: Publish verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/pendigits_45degree_dummy_axis/metrics.json results/pendigits_45degree_dummy_axis/stage_accuracy.csv
          git commit -m "results: validate dummy-axis 45-degree rotation without overlap"
          git pull --rebase origin main
          git push origin HEAD:main
