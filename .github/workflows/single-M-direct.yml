name: Direct learning in single M 3D lattice with dummy rotation column
on:
  push:
    paths:
      - ".github/workflows/single-M-direct.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy and check syntax
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m py_compile run_pendigits_single_M_direct.py
      - name: Learn every class in ONE shared M, test all orientations
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/pendigits_one_shared_M_dummy_axis
          python -u run_pendigits_single_M_direct.py 2>&1 | tee results/pendigits_one_shared_M_dummy_axis/run.log
      - name: Compare per-stage confusion against independent model
        run: |
          python - <<'PY'
          import json
          a=json.load(open("results/pendigits_one_shared_M_dummy_axis/metrics.json"))
          b=json.load(open("results/pendigits_45degree_isolated/metrics.json"))
          assert a["all_old_weight_slices_unchanged"]
          assert a["unused_rotation_axis"]=="M[:,16,0] all zero; effective position r stored at r+1"
          for i in range(4):
              assert a["stages"][i]["global_accuracy"]==b["all_stages"][i]["all_seen_class_accuracy"]
              assert a["stages"][i]["confusion"]==b["all_stages"][i]["confusion"]
          print("PASS: one physical M, no overlap, no forgetting by parameter overwrite, identical predictions")
          PY
      - name: Upload one-M actual checkpoint and metrics
        uses: actions/upload-artifact@v4
        with:
          name: pendigits-one-shared-M-direct-dummy-column
          path: results/pendigits_one_shared_M_dummy_axis/
          retention-days: 30
      - name: Persist actual measured metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/pendigits_one_shared_M_dummy_axis/metrics.json
          git commit -m "results: direct learning into one shared 3D M with a blank rotation-axis column"
          git pull --rebase origin main
          git push origin HEAD:main
