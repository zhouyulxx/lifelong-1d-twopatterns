name: Integer EEG repeated seeds and B-only control
on:
  push:
    paths:
      - ".github/workflows/eeg-integer-controls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - name: Evaluate B alone (from scratch, same split)
        shell: bash
        run: |
          set -o pipefail
          python -u run_integer_eeg_controls.py --seed 42 --epochs 20 2>&1 | tee /tmp/B_only.log
          cp /tmp/B_only.log results/eeg_integer_B_only_seed42/train.log
      - name: A-B-A repeated seed 43
        shell: bash
        run: |
          set -o pipefail
          python -u run_integer_eeg_tables.py --device cpu --seed 43 --epochs-a 20 --epochs-b 20 --window 30 --lr .005 --output results/eeg_integer_table_seed43 2>&1 | tee /tmp/seed43.log
          cp /tmp/seed43.log results/eeg_integer_table_seed43/train.log
      - name: A-B-A repeated seed 44
        shell: bash
        run: |
          set -o pipefail
          python -u run_integer_eeg_tables.py --device cpu --seed 44 --epochs-a 20 --epochs-b 20 --window 30 --lr .005 --output results/eeg_integer_table_seed44 2>&1 | tee /tmp/seed44.log
          cp /tmp/seed44.log results/eeg_integer_table_seed44/train.log
      - name: Upload checkpoint files
        uses: actions/upload-artifact@v4
        with:
          name: eeg-integer-baseline-controls
          path: |
            results/eeg_integer_B_only_seed42/
            results/eeg_integer_table_seed43/
            results/eeg_integer_table_seed44/
          retention-days: 30
      - name: Commit all metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/eeg_integer_B_only_seed42/*.json results/eeg_integer_B_only_seed42/train.log
          git add -f results/eeg_integer_table_seed43/*.json results/eeg_integer_table_seed43/*.csv results/eeg_integer_table_seed43/train.log
          git add -f results/eeg_integer_table_seed44/*.json results/eeg_integer_table_seed44/*.csv results/eeg_integer_table_seed44/train.log
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "results: EEG integer table 3-seed validation plus B-only control"
            git push origin HEAD:main
          fi
